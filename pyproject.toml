[project]
name = "quizz"
version = "0.1.0"
description = "Compile lecture slides into browser quizzes with deterministic grading"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pydantic>=2.8",
    "sympy>=1.13",
    "lark>=1.2",
    "pymupdf>=1.24",
    "markdown-it-py>=3.0",
]

[project.scripts]
quizz = "quizz.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quizz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: Playwright browser tests"]
